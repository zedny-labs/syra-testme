server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip text assets (JS, CSS, HTML, SVG) — biggest win for the animation scripts
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;

    # Spline 3D scene served as a raw binary
    location ~* \.splinecode$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }

    # Long cache for static assets, but always revalidate the HTML entry
    location ~* \.(js|jsx|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single entry point — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
