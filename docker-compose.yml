##################################################################
# SYRA LMS — Production Docker Compose
#
# Quick start:
#   1. cp backend/.env.docker.example backend/.env.docker
#   2. cp frontend/.env.production.example frontend/.env.production
#   3. docker compose up -d --build
#   4. Open http://localhost (or your domain)
#
# Optional local PostgreSQL:
#   Uncomment the "db" service below and set:
#     DATABASE_URL=postgresql+psycopg://syra:${POSTGRES_PASSWORD}@db:5432/syra_lms
##################################################################

services:
  # ── Optional: local PostgreSQL ────────────────────────
  # Uncomment if you don't use an external database (Supabase, Neon, etc.)
  #
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: syra_lms
  #     POSTGRES_USER: syra
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U syra -d syra_lms"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - internal
  #   # Do NOT expose 5432 externally in production

  # ── Backend (FastAPI + Gunicorn) ──────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    environment:
      AUTO_APPLY_MIGRATIONS: "${AUTO_APPLY_MIGRATIONS:-false}"
      WORKERS: "${WORKERS:-4}"
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "12"
      PROCTORING_INFERENCE_MODE: "celery"
      PROCTORING_INFERENCE_QUEUE: "proctoring-inference"
      PROCTORING_INFERENCE_OPEN_TIMEOUT_SECONDS: "180"
      PROCTORING_INFERENCE_TASK_TIMEOUT_SECONDS: "30"
      PROCTORING_BATCH_ANALYSIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      ai-worker:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/db" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    # Backend is only accessible via nginx — do NOT expose externally in production.
    # Host publish is env-overridable so a second (dev) stack can run on the same
    # VM without colliding. Default = production. Dev sets SYRA_BACKEND_PUBLISH.
    ports:
      - "${SYRA_BACKEND_PUBLISH:-127.0.0.1:8000:8000}"
    expose:
      - "8000"
    volumes:
      - backend-storage:/app/storage
    networks:
      - internal
    # Uncomment if using the local db service:
    # depends_on:
    #   db:
    #     condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # â”€â”€ Redis for Celery broker/result backend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # â”€â”€ Dedicated AI inference service â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ai-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    environment:
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      PROCTORING_INFERENCE_QUEUE: "proctoring-inference"
      PROCTORING_INFERENCE_OPEN_TIMEOUT_SECONDS: "180"
      PROCTORING_INFERENCE_TASK_TIMEOUT_SECONDS: "30"
    command: [ "celery", "-A", "src.app.core.celery_app.celery_app", "worker", "--loglevel=info", "--queues=proctoring-inference", "--concurrency=1" ]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # â”€â”€ Batch proctoring worker (Celery) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ai-batch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    environment:
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      PROCTORING_BATCH_ANALYSIS_ENABLED: "true"
    command: [ "celery", "-A", "src.app.core.celery_app.celery_app", "worker", "--loglevel=info", "--queues=proctoring-batch", "--concurrency=8" ]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    volumes:
      - backend-storage:/app/storage
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend (Nginx + React SPA) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - frontend/.env.production
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Host publish is env-overridable (default = production :8080). A dev stack on
    # the same VM sets SYRA_FRONTEND_PUBLISH=127.0.0.1:8081:80.
    ports:
      - "${SYRA_FRONTEND_PUBLISH:-8080:80}"
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-storage:
    # Docker-managed named volume. Data persists across rebuilds.
    # To use a host directory instead: docker compose down, then
    #   mkdir -p ./backend/storage && chown 1000:1000 ./backend/storage
    # and replace this block with:
    #   driver: local
    #   driver_opts: { type: none, o: bind, device: ./backend/storage }
    driver: local
  redis-data:
    driver: local
  # Uncomment if using local PostgreSQL:
  # pgdata:
  #   driver: local

networks:
  internal:
    driver: bridge
